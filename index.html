<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Retirement Countdown</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #dfeee8, #f8eee5);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        color: #333;
    }

    .card {
        width: 100%;
        max-width: 430px;
        background: rgba(255,255,255,0.92);
        border-radius: 30px;
        padding: 30px 22px;
        text-align: center;
        box-shadow: 0 15px 40px rgba(0,0,0,0.12);
    }

    h1 {
        margin: 0 0 8px;
        font-size: 30px;
    }

    .date {
        font-size: 17px;
        color: #777;
        margin-bottom: 28px;
    }

    .big-number {
        font-size: 72px;
        font-weight: 800;
        line-height: 1;
        margin: 10px 0;
    }

    .label {
        font-size: 18px;
        color: #666;
        margin-bottom: 28px;
    }

    .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 20px;
    }

    .stat {
        background: #f5f5f5;
        border-radius: 18px;
        padding: 18px 10px;
    }

    .stat-number {
        font-size: 28px;
        font-weight: 700;
    }

    .stat-label {
        font-size: 13px;
        color: #777;
        margin-top: 4px;
    }

    .message {
        margin-top: 25px;
        font-size: 18px;
        font-weight: 600;
    }

    .progress-container {
        margin-top: 25px;
        background: #e5e5e5;
        height: 14px;
        border-radius: 20px;
        overflow: hidden;
    }

    .progress {
        height: 100%;
        width: 0%;
        border-radius: 20px;
        background: #78a896;
        transition: width 0.5s ease;
    }

    .footer {
        margin-top: 25px;
        font-size: 12px;
        color: #999;
    }
</style>
</head>

<body>

<div class="card">

    <h1>🎉 Retirement Countdown</h1>

    <div class="date">
        June 9, 2027
    </div>

    <div class="big-number" id="workdays">
        0
    </div>

    <div class="label">
        workdays until retirement
    </div>

    <div class="stats">

        <div class="stat">
            <div class="stat-number" id="calendarDays">0</div>
            <div class="stat-label">calendar days</div>
        </div>

        <div class="stat">
            <div class="stat-number" id="weeks">0</div>
            <div class="stat-label">work weeks</div>
        </div>

    </div>

    <div class="progress-container">
        <div class="progress" id="progress"></div>
    </div>

    <div class="message" id="message">
        You've got this! 💪
    </div>

    <div class="footer">
        Monday–Friday • Paid holidays can be added
    </div>

</div>

<script>

const retirementDate = new Date("2027-06-09T00:00:00");

// Add paid holidays here.
// Format: "YYYY-MM-DD"
const holidays = [
    // "2026-09-07",
    // "2026-11-26",
    // "2026-12-25",
    // "2027-01-01",
];

function isHoliday(date) {

    const dateString =
        date.getFullYear() + "-" +
        String(date.getMonth() + 1).padStart(2, "0") + "-" +
        String(date.getDate()).padStart(2, "0");

    return holidays.includes(dateString);
}

function isWorkday(date) {

    const day = date.getDay();

    // Sunday = 0
    // Saturday = 6

    if (day === 0 || day === 6) {
        return false;
    }

    if (isHoliday(date)) {
        return false;
    }

    return true;
}

function calculateWorkdays(startDate, endDate) {

    let count = 0;

    let current = new Date(startDate);

    current.setHours(0,0,0,0);

    while (current < endDate) {

        if (isWorkday(current)) {
            count++;
        }

        current.setDate(current.getDate() + 1);
    }

    return count;
}

function updateCountdown() {

    const now = new Date();

    const calendarMilliseconds =
        retirementDate - now;

    const calendarDays =
        Math.max(
            0,
            Math.ceil(calendarMilliseconds / (1000 * 60 * 60 * 24))
        );

    const workdays =
        Math.max(
            0,
            calculateWorkdays(now, retirementDate)
        );

    const weeks =
        Math.floor(workdays / 5);

    document.getElementById("workdays").textContent =
        workdays.toLocaleString();

    document.getElementById("calendarDays").textContent =
        calendarDays.toLocaleString();

    document.getElementById("weeks").textContent =
        weeks.toLocaleString();

    // Progress calculation
    const startDate =
        new Date("2026-08-19T00:00:00");

    const totalWorkdays =
        calculateWorkdays(startDate, retirementDate);

    const remainingPercentage =
        workdays / totalWorkdays;

    const completed =
        Math.max(
            0,
            Math.min(
                100,
                (1 - remainingPercentage) * 100
            )
        );

    document.getElementById("progress").style.width =
        completed + "%";

    if (workdays <= 0) {

        document.getElementById("message").textContent =
            "🎊 YOU'RE RETIRED! 🎊";

    } else if (workdays <= 10) {

        document.getElementById("message").textContent =
            "🚨 The finish line is HERE!";

    } else if (workdays <= 30) {

        document.getElementById("message").textContent =
            "🥳 Almost there!";

    } else if (workdays <= 100) {

        document.getElementById("message").textContent =
            "🌴 The countdown is getting REAL!";

    } else {

        document.getElementById("message").textContent =
            "You've got this! 💪";
    }
}

updateCountdown();

setInterval(updateCountdown, 60000);

</script>

</body>
</html>
